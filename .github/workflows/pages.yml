name: Publish field guide
on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'translations/README.md', 'server/README.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            website
            docs
            server/README.md
            translations/README.md
          sparse-checkout-cone-mode: false
      - uses: actions/configure-pages@v5
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: python3 website/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4